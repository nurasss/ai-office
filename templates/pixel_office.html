<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Office — Pixel Office</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            min-height: 100dvh;
            background: #10121a;
            color: #eef2ff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
        }
        .header {
            min-height: 62px;
            padding: 14px 22px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid #262a36;
            background: #171a24;
        }
        .header h1 {
            margin: 0;
            font-size: 20px;
            line-height: 1.2;
        }
        .badge {
            color: #122018;
            background: #73e0a9;
            border-radius: 999px;
            padding: 2px 9px;
            font-size: 11px;
            font-weight: 800;
        }
        .tagline {
            color: #98a2b8;
            font-size: 13px;
        }
        .nav-actions {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .nav-link {
            color: #c7d2fe;
            text-decoration: none;
            font-size: 13px;
            font-weight: 700;
            border: 1px solid #3d4560;
            border-radius: 8px;
            padding: 7px 10px;
            background: #202432;
            white-space: nowrap;
        }
        .nav-link:hover {
            color: #fff;
            border-color: #5d8cff;
        }
        .shell {
            height: calc(100dvh - 62px);
            display: grid;
            grid-template-columns: minmax(0, 1fr) 340px;
            min-height: 0;
        }
        .stage {
            position: relative;
            min-width: 0;
            min-height: 0;
            background: #0d0f16;
            overflow: hidden;
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
            image-rendering: pixelated;
        }
        .hud {
            position: absolute;
            left: 18px;
            right: 18px;
            bottom: 18px;
            display: flex;
            align-items: center;
            gap: 12px;
            pointer-events: none;
        }
        .hud-card {
            min-height: 46px;
            border: 1px solid rgba(120, 134, 170, 0.32);
            border-radius: 8px;
            background: rgba(18, 21, 31, 0.88);
            backdrop-filter: blur(10px);
            padding: 9px 12px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.28);
        }
        .hud-title {
            font-size: 12px;
            color: #9ca8c8;
        }
        .hud-value {
            font-weight: 800;
            font-size: 14px;
            margin-top: 2px;
        }
        .side {
            border-left: 1px solid #262a36;
            background: #171a24;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }
        .panel-head {
            padding: 18px;
            border-bottom: 1px solid #262a36;
        }
        .panel-head h2 {
            margin: 0 0 6px;
            font-size: 16px;
        }
        .panel-head p {
            margin: 0;
            color: #98a2b8;
            font-size: 13px;
            line-height: 1.4;
        }
        .agent-list {
            overflow-y: auto;
            padding: 12px;
            display: grid;
            gap: 10px;
        }
        .agent-card {
            border: 1px solid #2b3142;
            border-radius: 8px;
            background: #1d2230;
            padding: 12px;
            display: grid;
            grid-template-columns: 32px minmax(0, 1fr);
            gap: 10px;
            align-items: center;
        }
        .agent-dot {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            border: 2px solid rgba(255, 255, 255, 0.55);
        }
        .agent-name {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            font-weight: 800;
            font-size: 14px;
        }
        .agent-status {
            color: #9ca8c8;
            font-size: 12px;
            margin-top: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .status-pill {
            min-width: 72px;
            text-align: center;
            border-radius: 999px;
            border: 1px solid #3b4358;
            padding: 3px 8px;
            font-size: 11px;
            color: #dbeafe;
            background: #252c3c;
        }
        .status-pill.thinking,
        .status-pill.routing,
        .status-pill.queued {
            color: #fef3c7;
            border-color: #8a6b2d;
            background: #372c19;
        }
        .status-pill.done,
        .status-pill.routed,
        .status-pill.delegated {
            color: #d1fae5;
            border-color: #327852;
            background: #173528;
        }
        .status-pill.error {
            color: #fee2e2;
            border-color: #944044;
            background: #3a1c22;
        }
        @media (max-width: 860px) {
            body { overflow: auto; }
            .header {
                align-items: flex-start;
                flex-wrap: wrap;
            }
            .nav-actions {
                width: 100%;
                margin-left: 0;
            }
            .shell {
                height: auto;
                grid-template-columns: 1fr;
            }
            .stage {
                height: 62vh;
                min-height: 430px;
            }
            .side {
                border-left: 0;
                border-top: 1px solid #262a36;
            }
        }
    </style>
</head>
<body>
<header class="header">
    <h1>AI Office</h1>
    <span class="badge">PIXEL</span>
    <span class="tagline">Живая карта статусов агентов</span>
    <nav class="nav-actions" aria-label="Навигация">
        <a class="nav-link" href="/">Чат</a>
        <a class="nav-link" href="/simulator">Симулятор</a>
        <a class="nav-link" href="https://office-ai-psi.vercel.app" target="_blank" rel="noopener noreferrer">Office AI</a>
    </nav>
</header>

<main class="shell">
    <section class="stage">
        <canvas id="office-canvas" aria-label="Pixel office live agent map"></canvas>
        <div class="hud">
            <div class="hud-card">
                <div class="hud-title">Live stream</div>
                <div class="hud-value" id="connection-state">подключение...</div>
            </div>
            <div class="hud-card">
                <div class="hud-title">Последнее событие</div>
                <div class="hud-value" id="last-event">ожидаем задачу</div>
            </div>
        </div>
    </section>

    <aside class="side">
        <div class="panel-head">
            <h2>Агенты</h2>
            <p>Откройте чат и отправьте задачу: персонаж выбранного агента начнёт двигаться и менять состояние.</p>
        </div>
        <div class="agent-list" id="agent-list"></div>
    </aside>
</main>

<script>
    const canvas = document.getElementById('office-canvas');
    const ctx = canvas.getContext('2d');
    const connectionState = document.getElementById('connection-state');
    const lastEvent = document.getElementById('last-event');
    const agentList = document.getElementById('agent-list');

    const agents = [
        { id: 'pmo', name: 'PMO', color: '#7c9cff', desk: { x: 0.50, y: 0.44 } },
        { id: 'data_analyst', name: 'Аналитик', color: '#55c7a7', desk: { x: 0.25, y: 0.26 } },
        { id: 'developer', name: 'Разработчик', color: '#f6c85f', desk: { x: 0.50, y: 0.24 } },
        { id: 'copywriter', name: 'Копирайтер', color: '#e48ad6', desk: { x: 0.75, y: 0.28 } },
        { id: 'support', name: 'Поддержка', color: '#66b7f0', desk: { x: 0.79, y: 0.55 } },
        { id: 'strategist', name: 'Стратег', color: '#ff8f70', desk: { x: 0.62, y: 0.75 } },
        { id: 'accountant', name: 'Бухгалтер', color: '#a7dc6f', desk: { x: 0.33, y: 0.72 } },
    ].map((agent, index) => ({
        ...agent,
        x: 120 + index * 36,
        y: 120 + (index % 2) * 26,
        targetX: 120 + index * 36,
        targetY: 120 + (index % 2) * 26,
        status: 'idle',
        message: 'Свободен',
        taskId: '',
        bob: Math.random() * Math.PI * 2,
    }));

    const statusLabels = {
        idle: 'idle',
        routing: 'routing',
        queued: 'queued',
        thinking: 'thinking',
        delegated: 'delegated',
        routed: 'routed',
        done: 'done',
        error: 'error',
    };

    const activeStatuses = new Set(['routing', 'queued', 'thinking', 'delegated', 'routed']);

    function fitCanvas() {
        const rect = canvas.getBoundingClientRect();
        const dpr = window.devicePixelRatio || 1;
        canvas.width = Math.max(320, Math.floor(rect.width * dpr));
        canvas.height = Math.max(320, Math.floor(rect.height * dpr));
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        placeIdleAgents();
    }

    function dimensions() {
        const rect = canvas.getBoundingClientRect();
        return { width: rect.width, height: rect.height };
    }

    function deskPosition(agent) {
        const { width, height } = dimensions();
        return {
            x: Math.round(width * agent.desk.x),
            y: Math.round(height * agent.desk.y),
        };
    }

    function placeIdleAgents() {
        const { width, height } = dimensions();
        agents.forEach((agent, index) => {
            if (activeStatuses.has(agent.status)) {
                const desk = deskPosition(agent);
                agent.targetX = desk.x;
                agent.targetY = desk.y + 34;
                return;
            }
            agent.targetX = Math.round(width * (0.18 + (index % 4) * 0.18));
            agent.targetY = Math.round(height * (0.50 + Math.floor(index / 4) * 0.20));
        });
    }

    function updateAgent(event) {
        const agent = agents.find((item) => item.id === event.agent_id);
        if (!agent) return;
        agent.status = event.status || 'idle';
        agent.message = event.message || 'Свободен';
        agent.taskId = event.task_id || '';
        if (activeStatuses.has(agent.status) || agent.status === 'done' || agent.status === 'error') {
            const desk = deskPosition(agent);
            agent.targetX = desk.x;
            agent.targetY = desk.y + 34;
        } else {
            placeIdleAgents();
        }
        lastEvent.textContent = `${agent.name}: ${agent.message || agent.status}`;
        renderAgentList();
    }

    function renderAgentList() {
        agentList.innerHTML = agents.map((agent) => {
            const pillClass = `status-pill ${agent.status}`;
            const label = statusLabels[agent.status] || agent.status;
            const detail = agent.taskId ? `${agent.message} · ${agent.taskId}` : agent.message;
            return `
                <article class="agent-card">
                    <div class="agent-dot" style="background:${agent.color}"></div>
                    <div>
                        <div class="agent-name">
                            <span>${agent.name}</span>
                            <span class="${pillClass}">${label}</span>
                        </div>
                        <div class="agent-status">${detail || 'Свободен'}</div>
                    </div>
                </article>
            `;
        }).join('');
    }

    async function loadSnapshot() {
        const response = await fetch('/api/agent-statuses', { credentials: 'include' });
        if (!response.ok) return;
        const data = await response.json();
        if (!Array.isArray(data.agents)) return;
        data.agents.forEach(updateAgent);
    }

    function connectEvents() {
        if (!window.EventSource) {
            connectionState.textContent = 'SSE недоступен';
            return;
        }

        const source = new EventSource('/api/agent-events');
        source.onopen = () => {
            connectionState.textContent = 'online';
        };
        source.onerror = () => {
            connectionState.textContent = 'переподключение';
        };
        source.onmessage = (message) => {
            const event = JSON.parse(message.data);
            if (event.type === 'snapshot') {
                event.agents.forEach(updateAgent);
                return;
            }
            if (event.type === 'agent_status') {
                updateAgent(event);
            }
        };
    }

    function drawFloor(width, height) {
        ctx.fillStyle = '#171b25';
        ctx.fillRect(0, 0, width, height);
        ctx.fillStyle = '#202636';
        const tile = 32;
        for (let y = 0; y < height; y += tile) {
            for (let x = 0; x < width; x += tile) {
                if (((x / tile) + (y / tile)) % 2 === 0) {
                    ctx.fillRect(x, y, tile, tile);
                }
            }
        }
        ctx.strokeStyle = 'rgba(255,255,255,0.035)';
        for (let x = 0; x < width; x += tile) {
            ctx.beginPath();
            ctx.moveTo(x, 0);
            ctx.lineTo(x, height);
            ctx.stroke();
        }
        for (let y = 0; y < height; y += tile) {
            ctx.beginPath();
            ctx.moveTo(0, y);
            ctx.lineTo(width, y);
            ctx.stroke();
        }
    }

    function drawDesk(agent) {
        const pos = deskPosition(agent);
        ctx.fillStyle = '#704f38';
        ctx.fillRect(pos.x - 44, pos.y - 18, 88, 36);
        ctx.fillStyle = '#8a6548';
        ctx.fillRect(pos.x - 40, pos.y - 22, 80, 8);
        ctx.fillStyle = '#232936';
        ctx.fillRect(pos.x - 16, pos.y - 32, 32, 20);
        ctx.fillStyle = activeStatuses.has(agent.status) ? '#73e0a9' : '#526071';
        ctx.fillRect(pos.x - 10, pos.y - 27, 20, 10);
        ctx.fillStyle = '#a97852';
        ctx.fillRect(pos.x - 38, pos.y + 18, 9, 28);
        ctx.fillRect(pos.x + 29, pos.y + 18, 9, 28);
        ctx.fillStyle = '#d7deef';
        ctx.font = '12px monospace';
        ctx.textAlign = 'center';
        ctx.fillText(agent.name, pos.x, pos.y - 42);
    }

    function drawAgent(agent, time) {
        const dx = agent.targetX - agent.x;
        const dy = agent.targetY - agent.y;
        agent.x += dx * 0.045;
        agent.y += dy * 0.045;
        agent.bob += 0.08;

        const active = activeStatuses.has(agent.status);
        const done = agent.status === 'done';
        const error = agent.status === 'error';
        const bob = active ? Math.sin(agent.bob) * 2 : 0;
        const x = Math.round(agent.x);
        const y = Math.round(agent.y + bob);

        ctx.fillStyle = 'rgba(0,0,0,0.28)';
        ctx.fillRect(x - 13, y + 25, 26, 5);
        ctx.fillStyle = agent.color;
        ctx.fillRect(x - 10, y - 6, 20, 28);
        ctx.fillStyle = '#f0c7a8';
        ctx.fillRect(x - 8, y - 22, 16, 16);
        ctx.fillStyle = '#2e3445';
        ctx.fillRect(x - 8, y - 24, 16, 5);
        ctx.fillStyle = '#111827';
        ctx.fillRect(x - 4, y - 16, 3, 3);
        ctx.fillRect(x + 4, y - 16, 3, 3);
        ctx.fillStyle = '#273043';
        ctx.fillRect(x - 12, y + 22, 8, 12);
        ctx.fillRect(x + 4, y + 22, 8, 12);

        if (active) {
            ctx.fillStyle = '#73e0a9';
            ctx.fillRect(x + 15, y - 20, 6, 6);
            ctx.fillRect(x + 23, y - 24 + Math.sin(time / 150) * 3, 5, 5);
            ctx.fillRect(x + 31, y - 21 + Math.cos(time / 170) * 3, 4, 4);
        }
        if (done || error) {
            ctx.fillStyle = done ? '#73e0a9' : '#ff7a7a';
            ctx.fillRect(x - 28, y - 38, 56, 18);
            ctx.fillStyle = '#111827';
            ctx.font = '11px monospace';
            ctx.textAlign = 'center';
            ctx.fillText(done ? 'done' : 'error', x, y - 25);
        }
    }

    function draw() {
        const { width, height } = dimensions();
        const time = performance.now();
        drawFloor(width, height);
        agents.forEach(drawDesk);
        [...agents].sort((a, b) => a.y - b.y).forEach((agent) => drawAgent(agent, time));
        requestAnimationFrame(draw);
    }

    window.addEventListener('resize', fitCanvas);
    fitCanvas();
    renderAgentList();
    loadSnapshot();
    connectEvents();
    draw();
</script>
</body>
</html>
