[project]
name = "ai-office"
version = "0.1.0"
description = "Personal Telegram-first AI office runtime"
requires-python = ">=3.11,<3.13"
dependencies = [
  "langgraph==0.2.74",
  "langchain==0.3.18",
  "langchain-core==0.3.53",
  "langchain-anthropic==0.3.12",
  "langchain-openai==0.2.13",
  "langchain-google-genai==2.0.1",
  "anthropic==0.69.0",
  "openai==1.102.0",
  "google-generativeai==0.8.5",
  "sqlalchemy==2.0.36",
  "alembic==1.14.0",
  "psycopg2-binary==2.9.10",
  "python-dotenv==1.0.1",
  "pydantic==2.9.2",
  "pydantic-settings==2.5.0",
  "pyyaml==6.0.2",
  "typing-extensions==4.12.2",
  "structlog==24.4.0",
  "fastapi==0.115.0",
  "uvicorn==0.34.0",
  "jinja2==3.1.6",
  "redis==5.2.1",
  "rq==2.0.0",
  "requests==2.32.3",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.5",
  "pytest-asyncio==0.24.0",
  "ruff==0.7.0",
  "mypy==1.13.0",
]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [
  ".venv",
  ".vercel",
  "data",
  "reports",
]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
