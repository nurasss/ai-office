name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ai_office
          POSTGRES_PASSWORD: ai_office
          POSTGRES_DB: ai_office_test
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt
          pip install ruff==0.7.0
      - name: Lint
        run: ruff check .
      - name: Secret scan
        run: python scripts/check_no_secrets.py
      - name: Run migrations
        env:
          DATABASE_URL: postgresql+psycopg2://ai_office:ai_office@localhost:5432/ai_office_test
        run: alembic upgrade head
      - name: Production env template check
        run: python scripts/production_preflight.py --env-file .env.production.example --template-check
      - name: Run tests
        env:
          DATABASE_URL: postgresql+psycopg2://ai_office:ai_office@localhost:5432/ai_office_test
          REDIS_URL: redis://localhost:6379/0
          ENABLE_REAL_TOOLS: "false"
          MODEL_PROVIDER_PRIMARY: fake
        run: pytest -q
