services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ai_office
      POSTGRES_PASSWORD: ai_office
      POSTGRES_DB: ai_office
    ports:
      - "5433:5432"
    volumes:
      - ai_office_postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"

volumes:
  ai_office_postgres:
